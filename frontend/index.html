<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-grid"></div>
  <main class="shell">
    <header class="hero">
      <h1>Collections Console</h1>
      <p>Authenticate, import Excel data, filter collections, and update editable rows.</p>
    </header>

    <section class="panel" id="config-panel">
      <h2>API Configuration</h2>
      <div class="row">
        <label for="api-base">API Base URL</label>
        <input id="api-base" type="text" value="http://localhost:8000" />
      </div>
    </section>

    <section class="panel split">
      <div>
        <h2>OAuth2 Login</h2>
        <div class="row">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="admin" />
        </div>
        <div class="row">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="secret" />
        </div>
        <button id="login-btn">Get JWT</button>
      </div>

      <div>
        <h2>Legacy Header Login</h2>
        <div class="row">
          <label for="x-user">X-User</label>
          <input id="x-user" type="text" placeholder="import_user" />
        </div>
        <button id="set-user-btn" class="ghost">Use X-User</button>
      </div>
    </section>

    <section class="panel" id="upload-panel">
      <h2>Upload Excel</h2>
      <div class="row">
        <label for="file-input">Workbook (.xlsx/.xls)</label>
        <input id="file-input" type="file" accept=".xlsx,.xls" />
      </div>
      <button id="upload-btn">Upload</button>
    </section>

    <section class="panel">
      <h2>Query Collections</h2>
      <div class="filters">
        <div class="row">
          <label for="filter-id">ID</label>
          <input id="filter-id" type="number" />
        </div>
        <div class="row">
          <label for="filter-read-only">Read Only</label>
          <select id="filter-read-only">
            <option value="">Any</option>
            <option value="true">true</option>
            <option value="false">false</option>
          </select>
        </div>
        <div class="row">
          <label for="filter-limit">Limit</label>
          <input id="filter-limit" type="number" value="100" min="1" max="1000" />
        </div>
      </div>
      <button id="load-btn">Load Collections</button>
      <div id="table-wrap" class="table-wrap"></div>
    </section>

    <section class="panel" id="update-panel">
      <h2>Update Collection</h2>
      <div class="filters">
        <div class="row">
          <label for="update-record-id">Record ID</label>
          <input id="update-record-id" type="number" />
        </div>
        <div class="row">
          <label for="update-name">Name</label>
          <input id="update-name" type="text" />
        </div>
        <div class="row">
          <label for="update-email">Email</label>
          <input id="update-email" type="email" />
        </div>
        <div class="row">
          <label for="update-contact">Contact</label>
          <input id="update-contact" type="text" />
        </div>
        <div class="row">
          <label for="update-date">Date</label>
          <input id="update-date" type="date" />
        </div>
      </div>
      <button id="update-btn">Update Record</button>
    </section>

    <section class="panel">
      <h2>Activity</h2>
      <pre id="output" class="output"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
