name: Migration Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mockup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mockup_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mockup_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import time
          import psycopg2

          dsn = "dbname=mockup_test user=postgres password=postgres host=localhost port=5432"
          for _ in range(30):
              try:
                  conn = psycopg2.connect(dsn)
                  conn.close()
                  print("Postgres is ready")
                  break
              except psycopg2.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("Postgres did not become ready in time")
          PY

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Alembic downgrade base
        run: python -m alembic downgrade base

      - name: Alembic upgrade head again
        run: python -m alembic upgrade head
